# 大观园 · Grand View Garden —— Nginx 站点配置（Aliyun）
# 静态后端（仅本机监听） + 反向代理（公网 80/443） + Certbot HTTPS
# 站点根目录：/srv/grandviewgarden（完整项目仓库；Web 仅公开 index.html）
# 说明：Nginx 配置、证书、日志属于系统基础设施，必须放在 /etc、/var/log 等系统路径，
#       不随项目文件存放在 /srv 内。

# ── 静态后端：只监听回环地址，不直接暴露公网 ────────────────────────────────
server {
    listen 127.0.0.1:1236;
    server_name localhost;
    root /srv/grandviewgarden;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # 站点是单文件应用：只公开 index.html，源码/文档/工具/仓库元数据不通过 Web 暴露
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ ^/(src|docs|tools|scripts|deploy|node_modules)/ {
        deny all;
    }
    location ~ ^/(package\.json|package-lock\.json|README\.md|LICENSE|CNAME)$ {
        deny all;
    }
    location ~ /\. {
        deny all;
    }
}

# ── 公网 HTTP：反向代理到静态后端；Certbot 会在此块上补 HTTPS ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name grandviewgarden.wentaox.cn;

    access_log /var/log/nginx/grandviewgarden.access.log;
    error_log  /var/log/nginx/grandviewgarden.error.log;

    location / {
        proxy_pass http://127.0.0.1:1236;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
