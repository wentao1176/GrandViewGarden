<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1a1f1c" />
<title>大观园 · 红楼梦 3D 体素复原</title>
<meta name="description" content="依《红楼梦》原文与红学考据复原的大观园三维体素园林，纯前端、可交互漫游。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2a24'/%3E%3Cpath d='M6 22h20v4H6z' fill='%23c9a53a'/%3E%3Cpath d='M9 13h14v9H9z' fill='%23a63a32'/%3E%3Cpath d='M7 13 16 5l9 8z' fill='%23586070'/%3E%3C/svg%3E" />
<style>/* ═══════════════════════════════════════════════════════════════════════════
   大观园 · 界面样式
   基调：墨綠 + 金 + 宋體/襯線；磨砂玻璃面板、金色細線、克制动效（150–400ms）。
   所有图标为内联 SVG；字体仅用系统字体；不加载任何外部资源。
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --ink: #efe6d2;
  --ink-soft: rgba(239, 230, 210, 0.78);
  --ink-dim: rgba(239, 230, 210, 0.56);
  --ink-faint: rgba(239, 230, 210, 0.36);
  --gold: #d8b64b;
  --gold-bright: #f0d98a;
  --gold-soft: rgba(216, 182, 75, 0.72);
  --gold-dim: rgba(216, 182, 75, 0.28);
  --gold-line: rgba(216, 182, 75, 0.26);
  --seal: #a63c31;
  --seal-bright: #c2503f;
  --panel: rgba(17, 23, 19, 0.78);
  --panel-strong: rgba(14, 20, 16, 0.9);
  --field: rgba(8, 12, 10, 0.34);
  --serif: "Songti SC", "STSong", "STZhongsong", "SimSun", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif", serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --shadow-panel: 0 18px 46px rgba(0, 0, 0, 0.42);
  --glass-blur: blur(16px) saturate(1.12);
  --ease: cubic-bezier(0.22, 0.8, 0.3, 1);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #0b100d;
}

body {
  position: fixed;
  inset: 0;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.6;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#app {
  position: absolute;
  inset: 0;
}

#scene {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
  background: #0e1411;
}

#ui-root {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

#ui-root > * {
  pointer-events: none;
}

#ui-root .brand,
#ui-root .tools,
#ui-root .poi-panel,
#ui-root .poi-card,
#ui-root .minimap-wrap,
#ui-root .dock,
#ui-root .modal-layer,
#ui-root .perf {
  pointer-events: auto;
}

#ui-root .poi-card:not(.is-open),
#ui-root .modal-layer:not(.is-open) {
  pointer-events: none !important;
}

#ui-root .panel-wrap {
  pointer-events: none;
}

#ui-root .panel-scrim {
  pointer-events: none;
}

#ui-root .panel-wrap.is-open .panel-scrim {
  pointer-events: auto;
}

button {
  font: inherit;
  color: inherit;
}

button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 1.5px solid var(--gold-bright);
  outline-offset: 2px;
}

::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(216, 182, 75, 0.26);
  border-radius: 3px;
}

* {
  scrollbar-width: thin;
  scrollbar-color: rgba(216, 182, 75, 0.26) transparent;
}

.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.ico {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  display: inline-block;
  vertical-align: -2px;
}

/* ─────────────────────────────── 启动页 ─────────────────────────────────── */
#boot {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
  background:
    radial-gradient(ellipse at 50% 28%, rgba(64, 86, 66, 0.5), transparent 62%),
    radial-gradient(ellipse at 18% 82%, rgba(40, 56, 44, 0.42), transparent 58%),
    radial-gradient(ellipse at 84% 76%, rgba(52, 64, 46, 0.32), transparent 60%),
    linear-gradient(180deg, #0a0f0c 0%, #0e1511 52%, #090e0b 100%);
  transition: opacity 0.8s ease, visibility 0.8s;
}

#boot::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    115deg,
    rgba(255, 255, 255, 0.012) 0 1px,
    transparent 1px 3px
  );
  pointer-events: none;
}

#boot.is-done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.boot-inner {
  position: relative;
  width: min(560px, calc(100vw - 40px));
  text-align: center;
  transform: translateY(-2vh);
}

.boot-seal {
  width: 64px;
  height: 64px;
  margin: 0 auto 22px;
  border: 2px solid var(--seal);
  border-radius: 8px;
  color: #ecd9b4;
  font-family: var(--serif);
  font-size: 38px;
  line-height: 60px;
  background: rgba(166, 60, 49, 0.14);
  box-shadow:
    inset 0 0 26px rgba(166, 60, 49, 0.3),
    0 0 38px rgba(166, 60, 49, 0.16);
  letter-spacing: 0;
  animation: bootSeal 2.6s ease-in-out infinite alternate;
}

@keyframes bootSeal {
  from { box-shadow: inset 0 0 26px rgba(166, 60, 49, 0.28), 0 0 30px rgba(166, 60, 49, 0.12); }
  to { box-shadow: inset 0 0 34px rgba(166, 60, 49, 0.42), 0 0 52px rgba(166, 60, 49, 0.24); }
}

#boot h1 {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: clamp(40px, 7vw, 66px);
  font-weight: 600;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  color: #f1e5c8;
  text-shadow: 0 2px 34px rgba(240, 214, 150, 0.16);
}

.boot-sub {
  margin: 0 0 38px;
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  color: var(--ink-dim);
}

.boot-bar {
  position: relative;
  width: min(320px, 62vw);
  height: 2px;
  margin: 0 auto;
  background: rgba(216, 182, 75, 0.16);
  overflow: hidden;
}

.boot-bar i {
  display: block;
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, rgba(216, 182, 75, 0.45), var(--gold), #f4dfa0);
  box-shadow: 0 0 12px rgba(216, 182, 75, 0.5);
  transition: width 0.45s var(--ease);
}

.boot-bar.is-full i {
  background: linear-gradient(90deg, var(--gold), #f6e8b8);
}

.boot-bar.is-error i {
  background: rgba(166, 60, 49, 0.6);
}

.boot-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  width: min(320px, 62vw);
  margin: 12px auto 0;
}

.boot-status {
  margin: 0;
  font-family: var(--serif);
  font-size: 12px;
  letter-spacing: 0.16em;
  color: var(--ink-dim);
  text-align: left;
  min-height: 18px;
}

.boot-pct {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--gold-soft);
  flex: 0 0 auto;
}

.boot-tip {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: calc(24px + var(--safe-b));
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: rgba(239, 230, 210, 0.38);
  text-align: center;
}

.boot-retry {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border: 1px solid var(--gold-dim);
  border-radius: 3px;
  background: rgba(216, 182, 75, 0.06);
  color: var(--gold-soft);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  cursor: pointer;
}

.boot-retry:hover {
  border-color: var(--gold-soft);
  color: var(--gold-bright);
}

#boot.is-slow .boot-retry {
  display: inline-flex;
}

#boot.is-slow .boot-tip-text {
  color: rgba(239, 230, 210, 0.52);
}

.boot-error {
  display: none;
  margin-top: 26px;
  padding: 20px 22px 18px;
  text-align: left;
  border: 1px solid rgba(216, 182, 75, 0.3);
  border-radius: 6px;
  background: linear-gradient(180deg, rgba(28, 34, 28, 0.86), rgba(15, 20, 16, 0.92));
  box-shadow: inset 0 1px 0 rgba(216, 182, 75, 0.12), 0 24px 60px rgba(0, 0, 0, 0.45);
}

#boot.has-error .boot-error {
  display: block;
}

#boot.has-error .boot-bar,
#boot.has-error .boot-line {
  opacity: 0.55;
}

.boot-error-title {
  margin: 0 0 8px;
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: #f0dcb0;
}

.boot-error-desc {
  margin: 0 0 12px;
  font-size: 12.5px;
  line-height: 1.8;
  color: var(--ink-soft);
}

.boot-error-list {
  margin: 0 0 12px;
  padding: 0 0 0 18px;
  list-style: none;
  counter-reset: bootSuggestion;
}

.boot-error-list li {
  position: relative;
  margin: 0 0 6px;
  font-size: 12px;
  line-height: 1.75;
  color: var(--ink-soft);
  counter-increment: bootSuggestion;
}

.boot-error-list li::before {
  content: counter(bootSuggestion) ".";
  position: absolute;
  left: -18px;
  color: var(--gold-soft);
  font-family: var(--mono);
  font-size: 10.5px;
}

.boot-error-detail {
  margin: 0 0 14px;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.7;
  color: var(--ink-faint);
}

.boot-error-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* 通用按钮（启动页错误 / 帮助 / 漫游字幕共用） */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 38px;
  padding: 8px 14px;
  border: 1px solid var(--gold-line);
  border-radius: 4px;
  background: var(--panel);
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 12.5px;
  letter-spacing: 0.14em;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease, transform 0.12s ease;
}

.btn:hover {
  border-color: rgba(216, 182, 75, 0.62);
  background: rgba(40, 49, 40, 0.92);
  color: #fdf5dd;
}

.btn:active {
  transform: translateY(1px);
}

.btn.on {
  border-color: var(--gold);
  background: rgba(74, 62, 30, 0.82);
  color: #ffedb9;
  box-shadow: inset 0 0 0 1px rgba(216, 182, 75, 0.24), 0 0 18px rgba(216, 182, 75, 0.16);
}

.btn-primary {
  border-color: rgba(216, 182, 75, 0.5);
  background: linear-gradient(180deg, rgba(92, 74, 32, 0.82), rgba(62, 50, 24, 0.86));
  color: #ffedb9;
}

.btn-xs {
  min-height: 30px;
  padding: 5px 10px;
  font-size: 11.5px;
  letter-spacing: 0.1em;
  background: rgba(13, 18, 14, 0.72);
}

.btn .lbl {
  display: inline-block;
}

/* ───────────────────────────── 暗角 / 场景压暗 ───────────────────────────── */
.vignette {
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(8, 12, 9, 0.3) 100%),
    linear-gradient(180deg, rgba(8, 12, 9, 0.18), transparent 14%, transparent 82%, rgba(8, 12, 9, 0.24));
  pointer-events: none !important;
}

/* ──────────────────────────────── 品牌区 ────────────────────────────────── */
.brand {
  position: absolute;
  top: calc(18px + var(--safe-t));
  left: calc(22px + var(--safe-l));
  z-index: 20;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  pointer-events: auto;
  transition: opacity 0.3s ease;
}

/* 顶部天空较亮时，给品牌区一层极淡的暗色晕染，保证文字可读 */
.brand::before {
  content: "";
  position: absolute;
  inset: -14px -24px -18px -14px;
  z-index: -1;
  border-radius: 18px;
  background: radial-gradient(ellipse at 32% 42%, rgba(7, 11, 8, 0.5), rgba(7, 11, 8, 0.16) 54%, transparent 76%);
  pointer-events: none;
}

.brand-seal {
  position: relative;
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid rgba(196, 74, 60, 0.9);
  border-radius: 5px;
  background:
    linear-gradient(150deg, rgba(166, 60, 49, 0.32), rgba(110, 36, 29, 0.3)),
    rgba(20, 26, 21, 0.6);
  box-shadow:
    inset 0 0 14px rgba(166, 60, 49, 0.34),
    0 6px 20px rgba(0, 0, 0, 0.36);
  cursor: pointer;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.brand-seal:hover {
  border-color: rgba(214, 96, 80, 0.95);
  box-shadow: inset 0 0 16px rgba(166, 60, 49, 0.44), 0 6px 22px rgba(0, 0, 0, 0.42);
}

.brand-seal-glyph {
  font-family: var(--serif);
  font-size: 23px;
  line-height: 1;
  color: #eeddc0;
  text-shadow: 0 0 10px rgba(242, 216, 170, 0.28);
}

.brand-main {
  padding-top: 1px;
  min-width: 0;
}

.brand-title {
  margin: 0;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: 0.24em;
  color: #f3e7cb;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  cursor: pointer;
  white-space: nowrap;
}

.brand-sub {
  margin: 3px 0 0;
  font-family: var(--serif);
  font-size: 10px;
  line-height: 1.5;
  letter-spacing: 0.24em;
  color: rgba(241, 232, 208, 0.78);
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
  white-space: nowrap;
}

.brand-meta {
  margin: 4px 0 0;
  font-size: 9.5px;
  letter-spacing: 0.1em;
  color: rgba(241, 232, 208, 0.48);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
  white-space: nowrap;
}

.brand-toggle {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  margin-top: 2px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(216, 182, 75, 0.22);
  border-radius: 4px;
  background: rgba(10, 15, 12, 0.32);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: rgba(239, 230, 210, 0.62);
  cursor: pointer;
  transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}

.brand-toggle:hover {
  color: var(--gold-bright);
  border-color: rgba(216, 182, 75, 0.5);
  background: rgba(18, 24, 19, 0.62);
}

.brand-toggle .ico {
  transition: transform 0.28s var(--ease);
}

.brand-toggle.is-collapsed .ico {
  transform: rotate(180deg);
}

.brand.is-min .brand-main {
  display: none;
}

.brand.is-min {
  gap: 0;
}

.brand.is-min .brand-toggle {
  margin-left: 2px;
}

/* ───────────────────────────── 右上工具区 ──────────────────────────────── */
.tools {
  position: absolute;
  top: calc(18px + var(--safe-t));
  right: calc(20px + var(--safe-r));
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
}

.tool-poi,
.tool-zen {
  min-height: 38px;
  padding: 8px 12px;
  font-size: 12px;
  letter-spacing: 0.12em;
}

.tool-poi .ico,
.tool-zen .ico {
  width: 14px;
  height: 14px;
}

/* ───────────────────────────── 景点目录 / 抽屉 ─────────────────────────── */
.panel-wrap {
  position: absolute;
  top: calc(102px + var(--safe-t));
  left: calc(22px + var(--safe-l));
  z-index: 24;
  display: flex;
  align-items: stretch;
  max-height: calc(100vh - 380px);
}

.poi-panel {
  width: 238px;
  max-height: inherit;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--gold-line);
  border-radius: 6px;
  background:
    linear-gradient(180deg, rgba(26, 33, 27, 0.82), rgba(15, 21, 17, 0.86)),
    var(--panel);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-panel);
  pointer-events: auto;
  transform-origin: top left;
  transition: opacity 0.28s ease, transform 0.28s var(--ease), visibility 0.28s;
}

.poi-panel::before {
  content: "";
  display: block;
  height: 1px;
  flex: 0 0 auto;
  background: linear-gradient(90deg, transparent, rgba(240, 217, 138, 0.5), transparent);
}

.panel-wrap:not(.is-open) .poi-panel {
  opacity: 0;
  visibility: hidden;
  transform: translateX(-14px);
  pointer-events: none;
}

.panel-scrim {
  display: none;
}

.poi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 12px 10px 14px;
  border-bottom: 1px solid rgba(216, 182, 75, 0.14);
}

.poi-head-main {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.poi-title {
  margin: 0;
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.28em;
  color: #f1e5c9;
  white-space: nowrap;
}

.poi-count {
  font-family: var(--serif);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  white-space: nowrap;
}

.poi-hide {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 30px;
  padding: 4px 7px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: rgba(239, 230, 210, 0.46);
  font-family: var(--serif);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

.poi-hide:hover {
  color: var(--gold-bright);
  border-color: var(--gold-dim);
  background: rgba(216, 182, 75, 0.08);
}

.poi-hide .ico {
  width: 12px;
  height: 12px;
}

.poi-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 2px 8px 10px;
  -webkit-overflow-scrolling: touch;
}

.poi-empty {
  margin: 16px 8px;
  font-family: var(--serif);
  font-size: 11.5px;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
  text-align: center;
}

.poi-group {
  padding-top: 2px;
}

.poi-group-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 8px 4px;
  font-family: var(--serif);
  font-size: 10px;
  letter-spacing: 0.28em;
  color: rgba(240, 217, 138, 0.62);
}

.poi-gdot {
  width: 5px;
  height: 5px;
  flex: 0 0 auto;
  background: var(--gc, var(--gold));
  transform: rotate(45deg);
  box-shadow: 0 0 0 1px rgba(8, 12, 10, 0.5);
}

.poi-gname {
  flex: 1;
}

.poi-gcount {
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.05em;
  color: rgba(239, 230, 210, 0.26);
}

.poi-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 34px;
  padding: 6px 9px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: rgba(239, 230, 210, 0.82);
  font-family: var(--serif);
  font-size: 12.5px;
  letter-spacing: 0.08em;
  text-align: left;
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}

.poi-item .ord {
  flex: 0 0 auto;
  width: 19px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.02em;
  color: rgba(216, 182, 75, 0.42);
  text-align: right;
}

.poi-item .zh {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.poi-item:hover {
  background: rgba(216, 182, 75, 0.09);
  color: #fdf3d8;
}

.poi-item.active {
  background: linear-gradient(90deg, rgba(166, 60, 49, 0.3), rgba(166, 60, 49, 0.06) 72%, transparent);
  color: #ffefc6;
  box-shadow: inset 2px 0 0 var(--gold);
}

.poi-item.active .ord {
  color: var(--gold-bright);
}

/* ─────────────────────────────── 信息卡 ─────────────────────────────────── */
.poi-card {
  position: absolute;
  left: 50%;
  bottom: calc(78px + var(--safe-b));
  z-index: 30;
  width: min(720px, calc(100vw - 380px));
  max-height: min(58vh, 460px);
  max-height: min(58dvh, 460px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--gold-line);
  border-radius: 8px;
  background:
    radial-gradient(ellipse at 12% 0%, rgba(216, 182, 75, 0.07), transparent 46%),
    linear-gradient(180deg, rgba(27, 34, 28, 0.92), rgba(15, 21, 17, 0.95));
  backdrop-filter: blur(18px) saturate(1.14);
  -webkit-backdrop-filter: blur(18px) saturate(1.14);
  box-shadow: 0 26px 70px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(240, 217, 138, 0.1);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translate(-50%, 18px) scale(0.995);
  transition: opacity 0.3s ease, transform 0.36s var(--ease), visibility 0.36s;
}

.poi-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 24px;
  right: 24px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(240, 217, 138, 0.55), transparent);
  pointer-events: none;
}

.poi-card.is-open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, 0) scale(1);
}

.poi-card.is-dragging {
  transition: none !important;
}

.card-handle {
  display: none;
}

.c-head {
  position: relative;
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 54px 0 22px;
}

.c-head-main {
  min-width: 0;
}

.c-eyebrow {
  margin: 0 0 5px;
  font-family: var(--serif);
  font-size: 9.5px;
  letter-spacing: 0.3em;
  color: var(--gold-soft);
}

.c-name {
  margin: 0;
  font-family: var(--serif);
  font-size: 25px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: 0.16em;
  color: #f8eed4;
  text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
}

.c-alias {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: rgba(216, 182, 75, 0.72);
}

.c-close {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: rgba(239, 230, 210, 0.46);
  cursor: pointer;
  transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

.c-close:hover {
  color: var(--gold-bright);
  border-color: var(--gold-dim);
  background: rgba(216, 182, 75, 0.08);
}

.c-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 8px 22px 18px;
  -webkit-overflow-scrolling: touch;
}

.c-label {
  flex: 0 0 auto;
  font-family: var(--serif);
  font-size: 9.5px;
  letter-spacing: 0.26em;
  color: rgba(216, 182, 75, 0.66);
  padding-top: 2px;
}

.c-plaque {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-top: 8px;
  padding: 9px 12px;
  border: 1px solid rgba(216, 182, 75, 0.18);
  border-radius: 4px;
  background: linear-gradient(90deg, rgba(216, 182, 75, 0.07), rgba(216, 182, 75, 0.02));
}

.cp-value {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  min-width: 0;
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: 0.1em;
  color: #f2e2b8;
}

.cp-main {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.cp-source {
  font-family: var(--serif);
  font-size: 9px;
  line-height: 1.6;
  letter-spacing: 0.06em;
  color: rgba(239, 230, 210, 0.34);
}

.cp-old {
  color: rgba(239, 230, 210, 0.5);
}

.cp-arrow {
  width: 13px;
  height: 13px;
  color: rgba(216, 182, 75, 0.55);
}

.cp-new {
  color: #f6e4b0;
}

.cp-note {
  font-family: var(--serif);
  font-size: 9px;
  letter-spacing: 0.12em;
  color: rgba(216, 182, 75, 0.52);
}

.c-couplets {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-top: 10px;
}

.cp-lines {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.c-couplet {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.c-line {
  display: block;
  font-family: var(--serif);
  font-size: 13px;
  line-height: 1.8;
  letter-spacing: 0.08em;
  color: #e8d7aa;
}

.c-source {
  font-family: var(--serif);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: rgba(239, 230, 210, 0.36);
}

.c-desc {
  margin: 10px 0 0;
  font-size: 12.5px;
  line-height: 1.9;
  color: rgba(239, 230, 210, 0.8);
}

.c-desc-empty {
  color: var(--ink-faint);
}

.quote {
  margin: 12px 0 0;
  padding: 10px 14px;
  border-left: 2px solid rgba(216, 182, 75, 0.52);
  border-radius: 0 4px 4px 0;
  background: linear-gradient(90deg, rgba(216, 182, 75, 0.08), transparent 82%);
}

.q-text {
  margin: 0;
  font-family: var(--serif);
  font-size: 13px;
  line-height: 1.95;
  letter-spacing: 0.03em;
  color: rgba(245, 237, 216, 0.92);
}

.q-src {
  display: block;
  margin-top: 6px;
  font-family: var(--serif);
  font-size: 10px;
  font-style: normal;
  letter-spacing: 0.16em;
  color: rgba(216, 182, 75, 0.68);
  text-align: right;
}

.c-poem {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-top: 10px;
}

.poem-text {
  margin: 0;
  font-family: var(--serif);
  font-size: 12.5px;
  line-height: 1.95;
  letter-spacing: 0.06em;
  color: rgba(232, 205, 140, 0.84);
  white-space: pre-line;
}

.poem-src {
  font-family: var(--serif);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: rgba(239, 230, 210, 0.34);
}

.c-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.tag {
  padding: 2px 9px;
  border: 1px solid rgba(216, 182, 75, 0.24);
  border-radius: 999px;
  background: rgba(216, 182, 75, 0.04);
  font-family: var(--serif);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  color: rgba(216, 182, 75, 0.78);
}

/* ──────────────────────────────── 小地图 ───────────────────────────────── */
.minimap-wrap {
  position: absolute;
  left: calc(22px + var(--safe-l));
  bottom: calc(20px + var(--safe-b));
  z-index: 22;
  width: 188px;
  overflow: hidden;
  border: 1px solid var(--gold-line);
  border-radius: 6px;
  background: var(--panel);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-panel);
  pointer-events: auto;
  transition: opacity 0.28s ease, transform 0.28s ease;
}

.mm-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 6px 6px 10px;
  border-bottom: 1px solid rgba(216, 182, 75, 0.14);
}

.mm-title {
  margin: 0;
  font-family: var(--serif);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.24em;
  color: rgba(244, 234, 210, 0.82);
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  white-space: nowrap;
}

.mm-hint {
  margin-left: auto;
  font-size: 9.5px;
  letter-spacing: 0.06em;
  color: rgba(239, 230, 210, 0.46);
  white-space: nowrap;
}

.mm-collapse {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 3px;
  background: transparent;
  color: rgba(239, 230, 210, 0.42);
  cursor: pointer;
  transition: color 0.18s ease, background 0.18s ease;
}

.mm-collapse:hover {
  color: var(--gold-bright);
  background: rgba(216, 182, 75, 0.1);
}

.mm-collapse .ico {
  width: 13px;
  height: 13px;
}

.mm-body {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #101713;
}

.mm-canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
  touch-action: none;
}

.mm-north {
  position: absolute;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--serif);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: rgba(247, 231, 183, 0.7);
  text-shadow: 0 1px 5px rgba(0, 0, 0, 0.9);
  pointer-events: none;
}

.mm-tip {
  position: absolute;
  z-index: 3;
  padding: 2px 8px;
  border: 1px solid var(--gold-line);
  border-radius: 3px;
  background: rgba(11, 16, 13, 0.92);
  font-family: var(--serif);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  color: #f5e9cb;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -130%);
  transition: opacity 0.15s ease;
}

.mm-tip.show {
  opacity: 1;
}

.minimap-wrap.is-collapsed .mm-body {
  display: none;
}

/* ──────────────────────────────── 底部控制条 ───────────────────────────── */
.dock {
  position: absolute;
  left: 50%;
  bottom: calc(16px + var(--safe-b));
  z-index: 26;
  transform: translateX(-50%);
  display: flex;
  align-items: stretch;
  gap: 2px;
  max-width: calc(100vw - 20px);
  padding: 5px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  border: 1px solid var(--gold-line);
  border-radius: 8px;
  background: var(--panel);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.46);
  pointer-events: auto;
  transition: opacity 0.28s ease, transform 0.28s ease;
}

.dock::-webkit-scrollbar {
  display: none;
}

.dock-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 38px;
  min-height: 38px;
  padding: 7px 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: rgba(239, 230, 210, 0.74);
  font-family: var(--serif);
  font-size: 12px;
  letter-spacing: 0.12em;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}

.dock-btn:hover {
  background: rgba(216, 182, 75, 0.1);
  color: #fdf3d9;
}

.dock-btn.on {
  background: rgba(216, 182, 75, 0.14);
  color: #ffeeb9;
  box-shadow: inset 0 0 0 1px rgba(216, 182, 75, 0.42);
}

.dock-btn .ico {
  width: 14px;
  height: 14px;
}

.dock-ico {
  display: inline-flex;
  align-items: center;
}

.dock-sep {
  flex: 0 0 auto;
  width: 1px;
  margin: 6px 4px;
  background: rgba(216, 182, 75, 0.16);
}

.tod-group {
  display: flex;
  align-items: stretch;
  gap: 1px;
  padding: 0 2px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.16);
}

.tod-btn {
  min-width: 36px;
  padding: 6px 7px;
}

.tod-char {
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: 0;
}

/* ─────────────────────────────── 漫游字幕 ──────────────────────────────── */
.tour-cap {
  position: absolute;
  left: 50%;
  bottom: calc(94px + var(--safe-b));
  z-index: 24;
  width: min(92vw, 660px);
  padding: 12px 22px 10px;
  transform: translate(-50%, 10px);
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.4s var(--ease);
}

.tour-cap::before {
  content: "";
  position: absolute;
  inset: -14px -26px -10px;
  z-index: -1;
  border-radius: 18px;
  background: radial-gradient(ellipse at 50% 52%, rgba(6, 10, 8, 0.72), rgba(6, 10, 8, 0.34) 56%, transparent 78%);
  pointer-events: none;
}

.tour-cap.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.t-meta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 6px;
  font-family: var(--serif);
  font-size: 9.5px;
  letter-spacing: 0.3em;
  color: var(--gold-soft);
}

.t-tag {
  padding: 1px 7px;
  border: 1px solid rgba(216, 182, 75, 0.3);
  border-radius: 2px;
  background: rgba(10, 15, 11, 0.5);
}

.t-idx {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  color: rgba(216, 182, 75, 0.6);
}

.t-name {
  margin: 0 0 5px;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.24em;
  color: #f8eed3;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
}

.t-q {
  margin: 0 auto;
  max-width: 580px;
  font-family: var(--serif);
  font-size: 13.5px;
  line-height: 1.9;
  letter-spacing: 0.04em;
  color: rgba(245, 237, 216, 0.9);
  text-shadow: 0 1px 16px rgba(0, 0, 0, 0.9);
}

.t-q[hidden],
.t-src[hidden] {
  display: none;
}

.t-src {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: rgba(216, 182, 75, 0.7);
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
}

.t-actions {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
  pointer-events: none;
}

.tour-cap.show .t-actions {
  pointer-events: auto;
}

/* ───────────────────────────── 首次进入提示 ─────────────────────────────── */
.welcome-hint {
  position: absolute;
  left: 50%;
  bottom: calc(86px + var(--safe-b));
  z-index: 25;
  transform: translate(-50%, 8px);
  padding: 7px 16px;
  border: 1px solid rgba(216, 182, 75, 0.22);
  border-radius: 999px;
  background: rgba(11, 16, 13, 0.66);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: var(--serif);
  font-size: 11.5px;
  letter-spacing: 0.14em;
  color: rgba(239, 230, 210, 0.72);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.4s var(--ease);
  white-space: nowrap;
}

.welcome-hint.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ─────────────────────────────── 性能面板 ──────────────────────────────── */
.perf {
  position: absolute;
  top: calc(112px + var(--safe-t));
  right: calc(20px + var(--safe-r));
  z-index: 58;
  width: 200px;
  padding: 10px 11px 9px;
  border: 1px solid rgba(216, 182, 75, 0.3);
  border-radius: 5px;
  background: rgba(8, 12, 10, 0.88);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.6;
  color: rgba(239, 230, 210, 0.78);
  display: none;
  pointer-events: auto;
}

.perf.show {
  display: block;
}

.p-title {
  margin: 0 0 6px;
  font-family: var(--serif);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--gold-soft);
}

.p-close {
  position: absolute;
  top: 4px;
  right: 5px;
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 3px;
  background: transparent;
  color: rgba(239, 230, 210, 0.5);
  cursor: pointer;
}

.p-close:hover {
  color: var(--gold-bright);
  background: rgba(216, 182, 75, 0.1);
}

.p-close .ico {
  width: 12px;
  height: 12px;
}

.p-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.p-k {
  color: rgba(239, 230, 210, 0.4);
}

.p-v {
  color: rgba(240, 217, 138, 0.86);
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ─────────────────────────────── 赏景模式 ───────────────────────────────── */
body.ui-hidden #ui-root {
  display: none;
}

body.zen #ui-root > *:not(.vignette) {
  opacity: 0 !important;
  pointer-events: none !important;
}

body.zen .vignette {
  background:
    radial-gradient(ellipse at 50% 46%, transparent 58%, rgba(6, 9, 7, 0.26) 100%),
    linear-gradient(180deg, rgba(6, 9, 7, 0.14), transparent 12%, transparent 84%, rgba(6, 9, 7, 0.18));
}

.zen-exit {
  position: fixed;
  right: calc(18px + var(--safe-r));
  bottom: calc(20px + var(--safe-b));
  z-index: 90;
  display: none;
  align-items: center;
  gap: 7px;
  padding: 9px 15px;
  border: 1px solid rgba(216, 182, 75, 0.3);
  border-radius: 999px;
  background: rgba(13, 18, 14, 0.62);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: rgba(240, 228, 200, 0.82);
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.14em;
  cursor: pointer;
  opacity: 0.86;
  transition: opacity 0.25s ease, border-color 0.2s ease, background 0.2s ease;
}

.zen-exit:hover,
.zen-exit:focus-visible {
  opacity: 1;
  border-color: var(--gold-soft);
  background: rgba(24, 31, 25, 0.86);
}

.zen-exit .ico {
  width: 14px;
  height: 14px;
}

body.zen .zen-exit {
  display: inline-flex;
}

.zen-exit.is-pulsing {
  animation: zenHint 5.5s ease forwards;
}

@keyframes zenHint {
  0% { opacity: 1; }
  70% { opacity: 0.92; }
  100% { opacity: 0.34; }
}

.zen-exit:hover,
.zen-exit:focus-visible {
  animation: none;
}

/* 移动端在赏景模式下只留小圆点，避免遮挡画面 */
@media (max-width: 820px) {
  .zen-exit {
    padding: 9px;
    min-width: 40px;
    min-height: 40px;
    justify-content: center;
  }

  .zen-exit .zex-text {
    display: none;
  }
}

/* ─────────────────────────────── 帮助弹层 ──────────────────────────────── */
.modal-layer {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(20px + var(--safe-t)) 18px calc(20px + var(--safe-b));
  background: rgba(5, 9, 7, 0.58);
  backdrop-filter: blur(7px) saturate(0.9);
  -webkit-backdrop-filter: blur(7px) saturate(0.9);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.3s ease, visibility 0.3s;
}

.modal-layer.is-open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.help {
  width: min(780px, 94vw);
  max-height: min(88vh, 860px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(216, 182, 75, 0.34);
  border-radius: 8px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(216, 182, 75, 0.08), transparent 46%),
    linear-gradient(180deg, rgba(27, 34, 28, 0.98), rgba(14, 20, 16, 0.99));
  box-shadow: 0 34px 90px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(240, 217, 138, 0.12);
  transform: translateY(16px) scale(0.995);
  transition: transform 0.34s var(--ease);
}

.modal-layer.is-open .help {
  transform: translateY(0) scale(1);
}

.help-head {
  position: relative;
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 15px 26px;
  border-bottom: 1px solid rgba(216, 182, 75, 0.16);
}

.help-title {
  margin: 0;
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.3em;
  color: #f6ead0;
}

.help-sub {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 10.5px;
  letter-spacing: 0.24em;
  color: var(--ink-dim);
}

.help-close {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: rgba(239, 230, 210, 0.48);
  cursor: pointer;
  transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

.help-close:hover {
  color: var(--gold-bright);
  border-color: var(--gold-dim);
  background: rgba(216, 182, 75, 0.08);
}

.help-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 4px 26px 18px;
  -webkit-overflow-scrolling: touch;
  user-select: text;
  -webkit-user-select: text;
}

.h-sec {
  padding: 16px 0 14px;
  border-bottom: 1px dashed rgba(216, 182, 75, 0.14);
}

.h-sec:last-child {
  border-bottom: 0;
}

.h-title {
  margin: 0 0 9px;
  font-family: var(--serif);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.3em;
  color: var(--gold-soft);
}

.h-p {
  margin: 0 0 8px;
  font-size: 12px;
  line-height: 1.9;
  color: rgba(239, 230, 210, 0.76);
}

.h-p:last-child {
  margin-bottom: 0;
}

.ops-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.op-col-title {
  margin: 0 0 6px;
  font-family: var(--serif);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: rgba(239, 230, 210, 0.62);
}

.op-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 3px 0;
  border-bottom: 1px solid rgba(216, 182, 75, 0.08);
}

.op-key {
  font-family: var(--serif);
  font-size: 11.5px;
  letter-spacing: 0.08em;
  color: #eedcae;
  white-space: nowrap;
}

.op-desc {
  font-size: 11.5px;
  line-height: 1.6;
  color: rgba(239, 230, 210, 0.6);
  text-align: right;
}

.keys-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
  gap: 4px 18px;
}

.key-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 3px 0;
}

.key-keys {
  display: inline-flex;
  gap: 3px;
  flex: 0 0 auto;
}

kbd {
  display: inline-block;
  min-width: 22px;
  padding: 1px 6px;
  border: 1px solid rgba(216, 182, 75, 0.3);
  border-bottom-width: 2px;
  border-radius: 3px;
  background: rgba(216, 182, 75, 0.09);
  font-family: var(--mono);
  font-size: 10px;
  text-align: center;
  color: #f2e5c2;
}

.key-desc {
  font-size: 11.5px;
  color: rgba(239, 230, 210, 0.66);
  text-align: right;
}

.legend-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.legend {
  display: grid;
  gap: 7px 16px;
}

.legend-groups {
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
}

.legend-symbols {
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  color: rgba(239, 230, 210, 0.68);
}

.legend-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  background: var(--gc, var(--gold));
  transform: rotate(45deg);
  box-shadow: 0 0 0 1px rgba(8, 12, 10, 0.6);
}

.symbol {
  position: relative;
  flex: 0 0 auto;
  width: 13px;
  height: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.symbol-poi::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 1px rgba(8, 12, 10, 0.5);
}

.symbol-active::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 1.5px #f7e7b7;
}

.symbol-view::before {
  content: "";
  width: 0;
  height: 0;
  border-left: 6px solid rgba(240, 217, 138, 0.55);
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
}

.symbol-north {
  border: 1px solid rgba(216, 182, 75, 0.32);
  border-radius: 2px;
  font-family: var(--serif);
  font-size: 8px;
  color: var(--gold-soft);
}

.help-foot {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 26px calc(13px + var(--safe-b));
  border-top: 1px solid rgba(216, 182, 75, 0.12);
  font-family: var(--serif);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--ink-faint);
}

.help-foot-note {
  letter-spacing: 0.1em;
}

/* 引擎渲染的地名标签层：定位与透明度由 main.js 每帧写内联样式；
   视觉样式与「显示/隐藏」的可见性在此定义（用 visibility，避免被内联 opacity 覆盖）。 */
.label-layer {
  position: absolute;
  inset: 0;
  z-index: 6;
  overflow: hidden;
  pointer-events: none !important;
}

.label-layer * {
  pointer-events: none !important;
}

.poi-label {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -100%);
  visibility: hidden;
  white-space: nowrap;
  padding: 3px 9px 4px;
  border: 1px solid rgba(216, 182, 75, 0.42);
  border-radius: 3px;
  background: rgba(13, 18, 15, 0.82);
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
  font-family: var(--serif);
  font-size: 12px;
  line-height: 1.4;
  letter-spacing: 0.14em;
  color: #fff6e0;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95);
  will-change: transform, opacity;
}

.poi-label.show {
  visibility: visible;
}

.noscript {
  position: absolute;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  background: #0e1411;
  color: var(--ink);
  font-size: 15px;
  text-align: center;
}

/* ═════════════════════════════ 响应式 · 平板 / 移动端 ═══════════════════ */
@media (max-width: 1100px) {
  .poi-card {
    width: min(720px, calc(100vw - 340px));
  }
}

@media (max-width: 820px) {
  :root {
    --glass-blur: blur(14px) saturate(1.1);
  }

  .brand {
    top: calc(12px + var(--safe-t));
    left: calc(12px + var(--safe-l));
    gap: 9px;
  }

  .brand-seal {
    width: 36px;
    height: 36px;
  }

  .brand-seal-glyph {
    font-size: 20px;
  }

  .brand-title {
    font-size: 17px;
    letter-spacing: 0.2em;
  }

  .brand-sub {
    font-size: 9px;
    letter-spacing: 0.18em;
    margin-top: 2px;
  }

  .brand-meta {
    display: none;
  }

  .brand-toggle {
    width: 36px;
    height: 36px;
  }

  .tools {
    top: calc(12px + var(--safe-t));
    right: calc(10px + var(--safe-r));
    gap: 6px;
  }

  .tool-poi,
  .tool-zen {
    min-height: 40px;
    padding: 8px 10px;
    font-size: 11.5px;
    letter-spacing: 0.08em;
  }

  .tool-zen .lbl {
    display: none;
  }

  /* 目录变为左侧抽屉 */
  .panel-wrap {
    position: fixed;
    inset: 0;
    top: 0;
    left: 0;
    max-height: none;
    z-index: 40;
    display: block;
  }

  .panel-scrim {
    display: block;
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 7, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }

  .panel-wrap.is-open .panel-scrim {
    opacity: 1;
    pointer-events: auto;
  }

  .poi-panel {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(84vw, 320px);
    max-height: none;
    border-radius: 0 8px 8px 0;
    border-left: 0;
    padding-top: var(--safe-t);
    padding-bottom: calc(8px + var(--safe-b));
    transform: translateX(-102%);
    transition: transform 0.3s var(--ease), opacity 0.3s ease, visibility 0.3s;
  }

  .panel-wrap:not(.is-open) .poi-panel {
    transform: translateX(-102%);
  }

  .panel-wrap.is-open .poi-panel {
    transform: translateX(0);
    opacity: 1;
    visibility: visible;
  }

  .poi-head {
    padding: 14px 12px 12px 16px;
  }

  .poi-title {
    font-size: 15px;
  }

  .poi-hide {
    min-width: 40px;
    min-height: 40px;
    justify-content: center;
  }

  .poi-hide .lbl {
    display: none;
  }

  .poi-item {
    min-height: 42px;
    padding: 9px 10px;
    font-size: 13.5px;
  }

  .poi-scroll {
    padding: 2px 8px 16px;
  }

  /* 信息卡变为底部抽屉 */
  .poi-card {
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    max-height: 62vh;
    max-height: 62dvh;
    border-radius: 16px 16px 0 0;
    border-left: 0;
    border-right: 0;
    border-bottom: 0;
    transform: translateY(100%);
    padding-bottom: calc(6px + var(--safe-b));
    transition: transform 0.34s var(--ease), opacity 0.3s ease, visibility 0.34s;
  }

  .poi-card::before {
    left: 46px;
    right: 46px;
  }

  .poi-card.is-open {
    transform: translateY(0);
  }

  .poi-card.is-expanded {
    max-height: 88vh;
    max-height: 88dvh;
  }

  .card-handle {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 38px;
    padding: 8px 16px 4px;
    border: 0;
    background: transparent;
    color: transparent;
    cursor: grab;
    touch-action: none;
  }

  .card-handle::before {
    content: "";
    width: 38px;
    height: 4px;
    border-radius: 2px;
    background: rgba(216, 182, 75, 0.34);
  }

  .card-handle-hint {
    position: absolute;
    right: 14px;
    top: 8px;
    font-family: var(--serif);
    font-size: 9px;
    letter-spacing: 0.12em;
    color: rgba(239, 230, 210, 0.28);
  }

  .card-handle .grip {
    display: none;
  }

  .c-head {
    padding: 2px 56px 0 18px;
  }

  .c-eyebrow {
    font-size: 9px;
  }

  .c-name {
    font-size: 21px;
    letter-spacing: 0.12em;
  }

  .c-alias {
    font-size: 10px;
  }

  .c-scroll {
    padding: 6px 18px 16px;
  }

  .c-plaque {
    gap: 9px;
  }

  .cp-value {
    font-size: 12px;
  }

  .q-text {
    font-size: 12px;
  }

  .c-desc {
    font-size: 12px;
  }

  .c-couplets {
    gap: 9px;
  }

  .c-line {
    font-size: 12px;
  }

  .poi-card .c-close {
    top: 6px;
    right: 8px;
    width: 38px;
    height: 38px;
  }

  /* 小地图缩小，置于控制条上方 */
  .minimap-wrap {
    width: 132px;
    left: calc(10px + var(--safe-l));
    bottom: calc(72px + var(--safe-b));
  }

  .mm-head {
    padding: 4px 4px 4px 8px;
    gap: 4px;
  }

  .mm-title {
    font-size: 10.5px;
    letter-spacing: 0.18em;
  }

  .mm-hint {
    display: none;
  }

  .mm-collapse {
    width: 36px;
    height: 36px;
  }

  .mm-north {
    font-size: 8px;
  }

  /* 底部控制条：图标化，按钮 ≥40px */
  .dock {
    bottom: calc(10px + var(--safe-b));
    gap: 0;
    padding: 4px;
    max-width: calc(100vw - 8px);
    border-radius: 10px;
  }

  .dock-btn {
    min-width: 40px;
    min-height: 40px;
    padding: 6px 8px;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    gap: 4px;
  }

  .dock-btn .ico {
    width: 15px;
    height: 15px;
  }

  .btn-compact .lbl {
    display: none;
  }

  .tod-group {
    padding: 0;
  }

  .tod-btn {
    min-width: 38px;
    padding: 6px;
  }

  .tod-char {
    font-size: 13.5px;
  }

  .dock-sep {
    margin: 6px 2px;
  }

  .tour-cap {
    bottom: calc(84px + var(--safe-b));
    width: min(94vw, 560px);
  }

  .tour-cap .btn-xs {
    min-height: 38px;
    padding: 7px 13px;
    font-size: 12px;
  }

  .boot-retry {
    min-height: 36px;
    padding: 6px 12px;
    font-size: 11.5px;
  }

  .t-name {
    font-size: 17px;
    letter-spacing: 0.16em;
  }

  .t-q {
    font-size: 12px;
    line-height: 1.8;
  }

  .welcome-hint {
    bottom: calc(78px + var(--safe-b));
    max-width: calc(100vw - 24px);
    padding: 6px 13px;
    font-size: 10.5px;
    letter-spacing: 0.08em;
  }

  .perf {
    top: calc(66px + var(--safe-t));
    right: calc(10px + var(--safe-r));
    width: 176px;
    font-size: 9.5px;
  }

  /* 抽屉打开时让出控制条 / 小地图 */
  body.card-open .dock,
  body.card-open .minimap-wrap,
  body.card-open .welcome-hint {
    opacity: 0 !important;
    pointer-events: none !important;
    transform: translateY(10px);
  }

  /* 漫游时让出小地图，避免字幕压在地图上 */
  body.tour-on .minimap-wrap {
    opacity: 0 !important;
    pointer-events: none !important;
    transform: translateY(10px);
  }

  .modal-layer {
    padding: 0;
    align-items: stretch;
  }

  .help {
    width: 100%;
    height: 100%;
    max-height: none;
    border: 0;
    border-radius: 0;
    padding-top: var(--safe-t);
    transform: translateY(100%);
    transition: transform 0.34s var(--ease);
  }

  .modal-layer.is-open .help {
    transform: translateY(0);
  }

  .help-head {
    padding: 16px 14px 12px 18px;
  }

  .help-title {
    font-size: 20px;
    letter-spacing: 0.24em;
  }

  .help-sub {
    font-size: 9.5px;
    letter-spacing: 0.16em;
  }

  .help-close {
    width: 44px;
    height: 44px;
  }

  .help-scroll {
    padding: 2px 18px 18px;
  }

  .ops-grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .keys-grid {
    grid-template-columns: 1fr;
  }

  .help-foot {
    padding: 10px 18px calc(12px + var(--safe-b));
    font-size: 9px;
  }
}

@media (max-width: 520px) {
  .tool-poi .lbl {
    display: inline;
  }

  .tool-poi,
  .tool-zen {
    min-width: 40px;
    justify-content: center;
  }

  .brand-title {
    font-size: 16px;
  }

  .dock-btn {
    padding: 6px 7px;
  }

  .poi-card {
    left: 0;
    right: 0;
  }

  .help-foot-note {
    display: none;
  }
}

/* 横屏（尤其手机横屏）：压扁控制条与小地图，避免遮挡画面 */
@media (max-height: 560px) and (orientation: landscape) {
  .brand-meta,
  .brand-sub {
    display: none;
  }

  .panel-wrap {
    top: calc(58px + var(--safe-t));
    max-height: calc(100vh - 112px);
    max-height: calc(100dvh - 112px);
  }

  .minimap-wrap {
    left: auto;
    right: calc(12px + var(--safe-r));
    bottom: calc(64px + var(--safe-b));
    width: 116px;
  }

  .mm-hint {
    display: none;
  }

  .mm-title {
    font-size: 10px;
    letter-spacing: 0.12em;
  }

  .mm-head {
    gap: 4px;
    padding-left: 7px;
  }

  .dock {
    bottom: calc(8px + var(--safe-b));
  }

  .dock-btn {
    min-height: 36px;
    min-width: 36px;
    padding: 4px 6px;
  }

  .poi-card {
    max-height: 74vh;
  }

  .tour-cap {
    bottom: calc(62px + var(--safe-b));
  }

  body.tour-on .minimap-wrap {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  .welcome-hint {
    display: none;
  }
}

/* 尊重「减少动态效果」偏好 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  .boot-seal {
    animation: none;
  }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="ui-root"><!-- 主界面骨架由 src/ui/ui.js 接管渲染；此处保留最小占位以保证构建稳定。 -->
</div>
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-seal">觀</div>
      <h1>大觀園</h1>
      <p class="boot-sub">紅樓夢 · 三維體素復原</p>
      <div class="boot-bar"><i></i></div>
      <p class="boot-status" id="boot-status">正在營造園林…</p>
    </div>
